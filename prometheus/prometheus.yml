global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'centrifugo'
    static_configs:
      - targets: ['centrifugo:8000']

  - job_name: 'ws-proxy'
    static_configs:
      - targets: ['ws-proxy:8001']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8081']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:8080']
    metrics_path: /stub_status